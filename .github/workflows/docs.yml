name: Review core documentation updates
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: docs-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/sync-docs.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automated/core-docs
          title: Refresh public documentation from core
          commit-message: Refresh pinned core documentation
          body: Review documentation changes against the currently shipped release before merging. The source commit is recorded in src/docs/source.json.
          add-paths: |
            src/docs/content
            src/docs/source.json
            public/docs-assets
